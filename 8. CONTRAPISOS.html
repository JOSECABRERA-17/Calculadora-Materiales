<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CONTRAPISOS - CALCULADORA</title>
        <link rel="shortcut icon" href="img/LOGO.jpg">
        <link rel="stylesheet" href="CSS/ESTILOS.CSS">
    </head>
    <body>
        <header>
            <img class="logo" src="img/LOGO.jpg" alt="Calculadora para construcción">
            <h1>CALCULADORA</h1>
        </header>
        <main>
            <section class="calculadora calculadora-contrapiso">
                <h2>CONTRAPISOS</h2>
                <form id="form-contrapiso">
                    <div class="datos-contrapiso">
                        <h3>DATOS DEL CONTRAPISO</h3>
                        <label for="Ancho">Ancho del contrapiso (M):</label>
                        <input class="inputs" type="number" id="Ancho" min="0" step="0.01" required>
                        <label for="Largo">Largo del contrapiso (M):</label>
                        <input class="inputs" type="number" id="Largo" min="0" step="0.01" required>
                        <label for="Espesor">Espesor del contrapiso (M):</label>
                        <input class="inputs" type="number" id="Espesor" min="0" step="0.01" required>
                    </div>
                    <div class="resultados">
                        <h3>RESULTADOS</h3>
                        <label for="Volumen"> Volumen (M3):</label>
                        <input class="inputs" type="number" id="Volumen" min="0" step="0.01" readonly>
                        <h3>MATERIALES NECESARIOS</h3>
                        <label for="Cemento">Cemento (Kg):</label>
                        <input class="inputs" type="number" id="Cemento" min="0" step="0.01" readonly>
                        <label for="Arena">Arena (M3):</label>
                        <input class="inputs" type="number" id="Arena" min="0" step="0.01" readonly>
                        <label for="Piedra">Piedra (M3):</label>
                        <input class="inputs" type="number" id="Piedra" min="0" step="0.01" readonly>
                    </div>
                    <input class="btn" type="submit" value="CALCULAR">
                </form>
                <a href="4. MENU.html">VOLVER AL MENÚ</a>
            </section>
        </main>
        <footer>
        <small>FET &copy; 2026</small>
        </footer>
        <script src="JavaScript/8. CONTRAPISO.JS"></script>
    </body>
</html>
