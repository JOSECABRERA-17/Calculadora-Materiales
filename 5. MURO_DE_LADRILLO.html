<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MURO DE LADRILLO- CALCULADORA</title>
        <link rel="shortcut icon" href="img/LOGO.jpg">
        <link rel="stylesheet" href="CSS/ESTILOS.CSS">
    </head>
    <body>
        <header>
            <img class="logo" src="img/LOGO.jpg" alt="Calculadora para construcción">
            <h1>CALCULADORA</h1>
        </header>
        <main>
            <section class="calculadora calculadora-muro">
                <h2>MURO DE LADRILLO</h2>
                <form id="form-muro">
                    <div class="datos-muro">
                        <h3>DATOS DEL MURO</h3>
                        <label for="Espesor">Espesor del ladrillo:</label>
                        <select class="inputs" id="Espesor" required>
                            <option value="">Seleccione</option>
                            <option value="20">20 Cm</option>
                            <option value="30">30 Cm</option>
                        </select>
                        <label for="Largo">Largo del muro (M):</label>
                        <input class="inputs" type="number" id="Largo" min="0" step="0.01" required>
                        <label for="Alto">Alto del muro (M):</label>
                        <input class="inputs" type="number" id="Alto" min="0" step="0.01" required>
                    </div>
                    <div class="resultados">
                        <h3>RESULTADOS</h3>
                        <label for="Superficie">Superficie del muro (M2):</label>
                        <input class="inputs" type="number" id="Superficie" min="0" step="0.01" readonly>
                        <h3>MATERIALES NECESARIOS</h3>
                        <label for="Cemento">Cemento (Kg):</label>
                        <input class="inputs" type="number" id="Cemento" min="0" step="0.01" readonly>
                        <label for="Arena">Arena (M3):</label>
                        <input class="inputs" type="number" id="Arena" min="0" step="0.01" readonly>
                        <label for="Ladrillos">Ladrillos (Unidad):</label>
                        <input class="inputs" type="number" id="Ladrillos" min="0" step="0.01" readonly>
                    </div>
                    <input class="btn" type="submit" value="CALCULAR">
                </form>
                <a href="4. MENU.html">VOLVER AL MENÚ</a>
            </section>
        </main>
        <footer>
        <small>FET &copy; 2026</small>
        </footer>
        <script src="JavaScript/5. MURO_DE_LADRILLO.JS"></script>
    </body>
</html>
