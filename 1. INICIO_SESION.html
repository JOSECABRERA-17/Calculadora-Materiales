<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scalable= 1.0, maximum-scalacle=1.0, minimum-scalable=1.0, user-scalable=no">
        <meta http-equiv="x-ua-compatible" content="ie=edge">
        <title> CALCULADORA </title>
        <meta name="descripcion" content="Calculadora Para Construccion">
        <meta name="keyword" content="web,html,pagina,css, javascript">
        <meta name="author" content="JOSE CABRERA">
        <link rel="shortcut icon" href="img/LOGO.jpg" sizes="16x16">
        <link rel="stylesheet" href="CSS/ESTILOS.CSS">
    </head>
    <body>
        <header>
            <img class="logo" src="img/LOGO.jpg" alt=" CALCULADORA PARA CONSTRUCCION ">
            <h1> CALCULADORA </h1>
        </header>
        <main>
            <section>
                <img class="simbolo" src="img/SIMBOLO.png" alt="">
                <form class="form-inicio" id="form-inicio" action="" method="post">
                    <input class="inputs" type="email" id="Usuario" placeholder="Correo del usuario:" maxlength="50" minlength="4" title="Introduce correo electronico" pattern="[a-zA-Z0-9_]+([.][a-zA-Z0-9_]+)*@[a-zA-Z0-9_]+([.][a-zA-Z0-9_]+)*[.][a-zA-Z]{1,5}" required>
                    <input class="inputs" type="password" id="Contraseña" placeholder="Contraseña:" maxlength="25" minlength="8" title="Introduce contraseña" pattern="{8,25}" required>
                    <input class="btn" type="submit" name="iniciar" value="Ingresar">
                </form>
                <div>
                    <a href="2. REGISTRO.html"> REGISTRATE </a>
                    <a href="3. RECUPERAR_CONTRASEÑA.html"> ¿OLVIDO SU CONTRASEÑA? </a>
                </div>
            </section>
        </main>
        <footer>
            <small>FET &copy; 2026</small>
        </footer>
        <script src="JavaScript/1. INICIO_SESION.JS"></script>
    </body>

</html>
