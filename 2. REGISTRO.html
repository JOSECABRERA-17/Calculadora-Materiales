<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRO-CALCULADORA</title>
    <link rel="shortcut icon" href="img/LOGO.jpg">
    <link rel="stylesheet" href="CSS/ESTILOS.CSS">
</head>
<body>
    <header>
        <img class="logo" src="img/LOGO.jpg" alt="Calculadora para construcción">
        <h1>CALCULADORA</h1>
    </header>
    <main>
        <section class="registro">
            <h2>CREAR CUENTA</h2>
            <form class="form-registro"  id="form-registro" action="" method="post">
                <label for="Nombre">NOMBRE DE USUARIO</label>
                <input class="inputs" type="text" id="Nombre" placeholder="Nombre:" maxlength="50" required>
                <label for="Correo">CORREO</label>
                <input class="inputs" type="email" id="Correo" placeholder="Correo electrónico:" maxlength="50" required>
                <label for="Contraseña">CONTRASEÑA</label>
                <input class="inputs" type="password" id="Contraseña" placeholder="Contraseña:" maxlength="25" minlength="8" required>
                <label for="ConfirmarContraseña">CONFIRMAR CONTRASEÑA</label>
                <input class="inputs" type="password" id="ConfirmarContraseña" placeholder="Confirmar contraseña:" maxlength="25" minlength="8" required>
                <input class="btn" type="submit" value="Registrarse">
            </form>
            <div class="iniciar-sesion"
                <span>¿YA TIENES UNA CUENTA?</span>
                <a href="1. INICIO_SESION.html">INICIAR SESIÓN </a>
            </div>
        </section>
    </main>
    <footer>
        <small>FET &copy; 2026</small>
    </footer>
    <script src="JavaScript/2. REGISTRO.JS"></script>
</body>
</html>
