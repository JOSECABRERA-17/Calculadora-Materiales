<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>VIGA DE HORMIGON - CALCULADORA</title>
        <link rel="shortcut icon" href="img/LOGO.jpg">
        <link rel="stylesheet" href="CSS/ESTILOS.CSS">
    </head>
    <body>
        <header>
            <img class="logo" src="img/LOGO.jpg" alt="Calculadora para construcción">
            <h1>CALCULADORA</h1>
        </header>
        <main>
            <section class="calculadora calculadora-viga">
                <h2>VIGA DE HORMIGÓN</h2>
                <form id="form-viga">
                    <div class="datos-viga">
                        <h3>DATOS DE LA VIGA</h3>
                        <label for="Ancho">Ancho de la viga (M):</label>
                        <input class="inputs" type="number" id="Ancho" min="0" step="0.01" required>
                        <label for="Largo">Largo de la viga (M):</label>
                        <input class="inputs" type="number" id="Largo" min="0" step="0.01" required>
                        <label for="Alto">Alto de la viga (M):</label>
                        <input class="inputs" type="number" id="Alto" min="0" step="0.01" required>
                    </div>
                    <div class="resultados">
                        <h3>RESULTADOS</h3>
                        <label for="Volumen">Volumen de la viga (M3):</label>
                        <input class="inputs" type="number" id="Volumen" min="0" step="0.01" readonly>
                        <h3>MATERIALES NECESARIOS</h3>
                        <label for="Cemento">Cemento (Kg):</label>
                        <input class="inputs" type="number" id="Cemento" min="0" step="0.01" readonly>
                        <label for="Arena">Arena (M3):</label>
                        <input class="inputs" type="number" id="Arena" min="0" step="0.01" readonly>
                        <label for="Piedra">Piedra (M3):</label>
                        <input class="inputs" type="number" id="Piedra" min="0" step="0.01" readonly>
                        <label for="Hierro4">Hierro 4 (M):</label>
                        <input class="inputs" type="number" id="Hierro4" min="0" step="0.01" readonly>
                        <label for="Hierro8">Hierro 8 (M):</label>
                        <input class="inputs" type="number" id="Hierro8" min="0" step="0.01" readonly>
                    </div>
                    <input class="btn" type="submit" value="CALCULAR">
                </form>
                <a href="4. MENU.html">VOLVER AL MENÚ</a>
            </section>
        </main>
        <footer>
        <small>FET &copy; 2026</small>
        </footer>
        <script src="JavaScript/6. VIGA_DE_HORMIGON.JS"></script>
    </body>
</html>
