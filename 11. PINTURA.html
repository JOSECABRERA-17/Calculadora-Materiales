<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PINTURA - CALCULADORA</title>
        <link rel="shortcut icon" href="img/LOGO.jpg">
        <link rel="stylesheet" href="CSS/ESTILOS.CSS">
    </head>
    <body>
        <header>
            <img class="logo" src="img/LOGO.jpg" alt="Calculadora para construcción">
            <h1>CALCULADORA</h1>
        </header>
        <main>
            <section class="calculadora calculadora-pintura">
                <h2>PINTURA</h2>
                <form id="form-pintura">
                    <div class="datos-pintura">
                        <h3>DATOS DE LA PINTURA</h3>
                        <label for="Superficie">Superficie del muro (M2):</label>
                        <input class="inputs" type="number" id="Superficie" min="0" step="0.01" required>
                        <label for="Rendimiento">Rendimiento :</label>
                        <input class="inputs" type="number" id="Rendimiento" min="0" step="0.01" required>
                    </div>
                    <div class="resultados">
                        <h3>RESULTADOS</h3>
                        <label for="Pintura"> Pintura necesaria (L):</label>
                        <input class="inputs" type="number" id="Pintura" min="0" step="0.01" readonly>
                    </div>
                    <input class="btn" type="submit" value="CALCULAR">
                </form>
                <a href="4. MENU.html">VOLVER AL MENÚ</a>
            </section>
        </main>
        <footer>
        <small>FET &copy; 2026</small>
        </footer>
        <script src="JavaScript/11. PINTURA.JS"></script>
    </body>
</html>
